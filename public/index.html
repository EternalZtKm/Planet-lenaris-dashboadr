<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melonly Staff Panel | Planet Lenaris</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0e14; color: #d0d7de; font-family: 'Inter', sans-serif; }
        .card { background-color: #161b22; border: 1px solid #21262d; }
        input, select, textarea { background-color: #0d1117; border: 1px solid #30363d; color: #f0f6fc; }
        input:focus, select:focus, textarea:focus { border-color: #58a6ff; outline: none; }
    </style>
</head>
<body class="p-6 min-h-screen">

    <div id="loginOverlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="card p-8 rounded-2xl max-w-sm w-full text-center space-y-6 border border-slate-800 shadow-2xl">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-3xl mx-auto shadow-lg">
                <i class="fa-brands fa-discord"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-white">Staff Authorization</h2>
                <p class="text-xs text-slate-400 mt-1">Sign in with Discord to access the Planet Lenaris Staff Dashboard.</p>
            </div>
            <a href="/api/auth/discord/login" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition flex items-center justify-center space-x-2">
                <i class="fa-brands fa-discord"></i>
                <span>Log In with Discord</span>
            </a>
            <p id="authErrorMsg" class="text-xs text-rose-400 font-semibold hidden"></p>
        </div>
    </div>

    <header class="flex justify-between items-center pb-6 border-b border-slate-800 mb-6">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-pink-600 flex items-center justify-center text-white font-bold text-xl shadow-lg">
                <i class="fa-solid fa-watermelon-slice"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide">Melonly Staff Dashboard</h1>
                <p class="text-xs text-slate-400">Planet Lenaris Roleplay | Staff Portal</p>
            </div>
        </div>

        <div id="userProfile" class="flex items-center space-x-3 hidden">
            <img id="userAvatar" class="w-8 h-8 rounded-full border border-slate-700" alt="Avatar">
            <div>
                <span id="userName" class="text-xs font-bold text-white block"></span>
                <span class="text-[10px] text-emerald-400 font-semibold">Verified Staff</span>
            </div>
            <button onclick="logout()" title="Log Out" class="text-xs text-rose-400 hover:text-rose-300 ml-2">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <div class="space-y-6">
            <div class="card p-5 rounded-2xl space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-white text-sm uppercase tracking-wider">Shift Controls</h2>
                    <span id="shiftBadge" class="text-xs px-2.5 py-1 rounded-full bg-rose-950 text-rose-400 border border-rose-800 font-semibold">OFFLINE</span>
                </div>

                <div class="flex space-x-3">
                    <button id="btnStartShift" onclick="toggleShift('CLOCK_IN')" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition shadow-lg">
                        Start Shift
                    </button>
                    <button id="btnEndShift" onclick="toggleShift('CLOCK_OUT')" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-lg hidden">
                        End Shift
                    </button>
                </div>
            </div>

            <div class="card p-5 rounded-2xl space-y-3">
                <h2 class="font-bold text-white text-sm uppercase tracking-wider mb-2">Toolbox</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="alert('LOA request submitted.')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-umbrella-beach"></i>
                        <span>Manage LOA</span>
                    </button>
                    <button onclick="alert('Run Command open.')" class="bg-pink-600 hover:bg-pink-500 text-white font-semibold py-2 px-3 rounded-lg text-xs transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-terminal"></i>
                        <span>Run Command</span>
                    </button>
